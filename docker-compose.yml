version: '3.8'

services:
  # Flask应用
  web:
    build: .
    container_name: ytmp-web
    restart: always
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DATABASE_URL=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-123456}@host.docker.internal:3306/hnkj
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-this}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:?Set ZHIPU_API_KEY in the environment}
      - FLASK_ENV=production
      - FLASK_DEBUG=0
    volumes:
      - ./app/static/uploads:/app/app/static/uploads
      - ./app/static/avatars:/app/app/static/avatars
      - ./logs:/var/log/YTMP
    networks:
      - ytmp-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Nginx反向代理
  nginx:
    image: nginx:alpine
    container_name: ytmp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf
      - ./app/static:/var/www/static:ro
    depends_on:
      - web
    networks:
      - ytmp-network
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

networks:
  ytmp-network:
    driver: bridge
