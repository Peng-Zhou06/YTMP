[program:ytmp]
command=/root/YTMP/.venv/bin/gunicorn --config /root/YTMP/gunicorn.conf.py wsgi:app
directory=/root/YTMP
user=root
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/ytmp/supervisor.log
stderr_logfile=/var/log/ytmp/supervisor.err
environment=FLASK_ENV=production